<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1100" viewBox="0 0 1536 1100" role="img" aria-labelledby="title description">
  <title id="title">电商智能客服系统架构</title>
  <desc id="description">上半部分是在线客服请求：入口、安全与上下文、任务规划，再进入五条路径并输出结构化证据。知识检索只召回子块，经 RRF 和重排后从同一快照回填可靠父块，整块控制预算并提供引用。售后资格核验后通过 LangGraph 原生 interrupt 等待审批；Resume 校验后恢复原图，复查事实并防重记录模拟申请，图快照与业务审批分别持久化到 SQLite。下半部分是知识准备：多格式文件经过 Loader、元数据和页码偏移校验、父子分块，构建包含父子正文和映射的进程内版本索引；只有子块按需生成向量。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#2456a6"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#087d83"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { fill: #123061; font-size: 43px; font-weight: 750; }
      .subtitle { fill: #506682; font-size: 21px; }
      .section-title { fill: #123061; font-size: 25px; font-weight: 700; }
      .section-note { fill: #60738e; font-size: 17px; }
      .stage-title { fill: #173b70; font-size: 23px; font-weight: 700; }
      .stage-body { fill: #526780; font-size: 17px; }
      .lane-title { fill: #123061; font-size: 23px; font-weight: 700; }
      .lane-body { fill: #344c6b; font-size: 18px; }
      .lane-note { fill: #687c93; font-size: 16px; }
      .ingest-title { fill: #0a626b; font-size: 22px; font-weight: 700; }
      .ingest-body { fill: #3f6268; font-size: 17px; }
      .footer-title { fill: #173b70; font-size: 19px; font-weight: 700; }
      .footer-body { fill: #526780; font-size: 16px; }
      .flow-blue { fill: none; stroke: #2456a6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .flow-teal { fill: none; stroke: #087d83; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow-teal); }
    </style>
  </defs>

  <rect width="1536" height="1100" fill="#f6f9fc"/>
  <text class="title" x="768" y="62" text-anchor="middle">电商智能客服 · 系统架构</text>
  <text class="subtitle" x="768" y="96" text-anchor="middle">在线路由执行  /  子块定位 · 父块回填  /  可追溯的质量闭环</text>

  <!-- 在线服务：每轮客服请求走此链路。 -->
  <rect x="24" y="121" width="1488" height="558" rx="19" fill="#ffffff" stroke="#a8c2e5" stroke-width="2"/>
  <rect x="24" y="121" width="1488" height="43" rx="19" fill="#e9f1fc"/>
  <rect x="24" y="145" width="1488" height="19" fill="#e9f1fc"/>
  <text class="section-title" x="47" y="151">在线客服请求</text>
  <text class="section-note" x="1486" y="151" text-anchor="end">每轮请求执行</text>

  <rect x="48" y="182" width="348" height="78" rx="13" fill="#eef6ff" stroke="#86afe0" stroke-width="2"/>
  <text class="stage-title" x="222" y="216" text-anchor="middle">用户请求</text>
  <text class="stage-body" x="222" y="245" text-anchor="middle">咨询 · 多轮会话 · 售后申请</text>
  <rect x="412" y="182" width="348" height="78" rx="13" fill="#eef6ff" stroke="#86afe0" stroke-width="2"/>
  <text class="stage-title" x="586" y="216" text-anchor="middle">FastAPI 统一入口</text>
  <text class="stage-body" x="586" y="245" text-anchor="middle">请求校验 · 会话标识</text>
  <rect x="776" y="182" width="348" height="78" rx="13" fill="#eefaf9" stroke="#77babd" stroke-width="2"/>
  <text class="stage-title" x="950" y="216" text-anchor="middle">安全扫描与上下文</text>
  <text class="stage-body" x="950" y="245" text-anchor="middle">身份通道 · 会话记忆 · 安全边界</text>
  <rect x="1140" y="182" width="348" height="78" rx="13" fill="#f2f2ff" stroke="#9f9ae0" stroke-width="2"/>
  <text class="stage-title" x="1314" y="216" text-anchor="middle">意图识别与任务规划</text>
  <text class="stage-body" x="1314" y="245" text-anchor="middle">模型路由 · 风险规则约束</text>
