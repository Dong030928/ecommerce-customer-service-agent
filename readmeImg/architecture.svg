<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1100" viewBox="0 0 1536 1100" role="img" aria-labelledby="title description">
  <title id="title">电商智能客服系统架构</title>
  <desc id="description">上半部分是在线客服请求：入口、安全与上下文、任务规划，再进入常规对话、知识检索、只读工具、工具与知识联合、售后工作流五条路径，最终输出安全响应与结构化证据。下半部分是与在线请求分离的知识索引构建：多格式本地文档经过 LangChain Loader、元数据和章节或页校验、切块，进入进程内索引；检索时按需生成并缓存向量。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#2456a6"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#087d83"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { fill: #123061; font-size: 43px; font-weight: 750; }
      .subtitle { fill: #506682; font-size: 21px; }
      .section-title { fill: #123061; font-size: 25px; font-weight: 700; }
      .section-note { fill: #60738e; font-size: 17px; }
      .stage-title { fill: #173b70; font-size: 23px; font-weight: 700; }
      .stage-body { fill: #526780; font-size: 17px; }
      .lane-title { fill: #123061; font-size: 23px; font-weight: 700; }
      .lane-body { fill: #344c6b; font-size: 18px; }
      .lane-note { fill: #687c93; font-size: 16px; }
      .ingest-title { fill: #0a626b; font-size: 22px; font-weight: 700; }
      .ingest-body { fill: #3f6268; font-size: 17px; }
      .footer-title { fill: #173b70; font-size: 19px; font-weight: 700; }
      .footer-body { fill: #526780; font-size: 16px; }
      .flow-blue { fill: none; stroke: #2456a6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .flow-teal { fill: none; stroke: #087d83; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow-teal); }
    </style>
  </defs>

  <rect width="1536" height="1100" fill="#f6f9fc"/>
  <text class="title" x="768" y="62" text-anchor="middle">电商智能客服 · 系统架构</text>
  <text class="subtitle" x="768" y="96" text-anchor="middle">在线路由执行  /  多格式知识接入  /  可追溯的质量闭环</text>

  <!-- 在线服务：每轮客服请求走此链路。 -->
  <rect x="24" y="121" width="1488" height="558" rx="19" fill="#ffffff" stroke="#a8c2e5" stroke-width="2"/>
  <rect x="24" y="121" width="1488" height="43" rx="19" fill="#e9f1fc"/>
  <rect x="24" y="145" width="1488" height="19" fill="#e9f1fc"/>
  <text class="section-title" x="47" y="151">在线客服请求</text>
  <text class="section-note" x="1486" y="151" text-anchor="end">每轮请求执行</text>

  <rect x="48" y="182" width="348" height="78" rx="13" fill="#eef6ff" stroke="#86afe0" stroke-width="2"/>
  <text class="stage-title" x="222" y="216" text-anchor="middle">用户请求</text>
  <text class="stage-body" x="222" y="245" text-anchor="middle">咨询 · 多轮会话 · 售后申请</text>
  <rect x="412" y="182" width="348" height="78" rx="13" fill="#eef6ff" stroke="#86afe0" stroke-width="2"/>
  <text class="stage-title" x="586" y="216" text-anchor="middle">FastAPI 统一入口</text>
  <text class="stage-body" x="586" y="245" text-anchor="middle">请求校验 · 会话标识</text>
  <rect x="776" y="182" width="348" height="78" rx="13" fill="#eefaf9" stroke="#77babd" stroke-width="2"/>
  <text class="stage-title" x="950" y="216" text-anchor="middle">安全扫描与上下文</text>
  <text class="stage-body" x="950" y="245" text-anchor="middle">可信身份 · 会话记忆 · 压缩</text>
  <rect x="1140" y="182" width="348" height="78" rx="13" fill="#f2f2ff" stroke="#9f9ae0" stroke-width="2"/>
  <text class="stage-title" x="1314" y="216" text-anchor="middle">意图识别与任务规划</text>
  <text class="stage-body" x="1314" y="245" text-anchor="middle">模型路由 · 风险规则约束</text>
  <path class="flow-blue" d="M 397 221 H 405"/>
  <path class="flow-blue" d="M 761 221 H 769"/>
  <path class="flow-blue" d="M 1125 221 H 1133"/>
  <path d="M 1314 260 V 293 H 184 M 1314 293 H 1352" fill="none" stroke="#2456a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="flow-blue" d="M 184 293 V 319"/>
  <path class="flow-blue" d="M 476 293 V 319"/>
  <path class="flow-blue" d="M 768 293 V 319"/>
  <path class="flow-blue" d="M 1060 293 V 319"/>
  <path class="flow-blue" d="M 1352 293 V 319"/>

  <rect x="48" y="327" width="272" height="231" rx="14" fill="#f3f8ff" stroke="#8bb6e7" stroke-width="2"/>
  <rect x="59" y="340" width="250" height="44" rx="9" fill="#e2efff"/>
  <text class="lane-title" x="184" y="370" text-anchor="middle">① 常规对话</text>
  <text class="lane-body" x="184" y="426" text-anchor="middle">问候与基础交互</text>
  <text class="lane-body" x="184" y="459" text-anchor="middle">多轮澄清与指代消歧</text>
  <text class="lane-note" x="184" y="519" text-anchor="middle">无需证据时避免额外调用</text>

  <rect x="340" y="327" width="272" height="231" rx="14" fill="#effaf9" stroke="#75c2c3" stroke-width="2"/>
  <rect x="351" y="340" width="250" height="44" rx="9" fill="#d9f1f0"/>
  <text class="lane-title" x="476" y="370" text-anchor="middle">② 知识检索</text>
  <text class="lane-body" x="476" y="419" text-anchor="middle">原问向量 · 改写向量</text>
  <text class="lane-body" x="476" y="450" text-anchor="middle">关键词 → 加权 RRF</text>
  <text class="lane-body" x="476" y="481" text-anchor="middle">重排 · 引用 · 置信度</text>
  <text class="lane-note" x="476" y="526" text-anchor="middle">读取下方进程内知识索引</text>

  <rect x="632" y="327" width="272" height="231" rx="14" fill="#f3f8ff" stroke="#8bb6e7" stroke-width="2"/>
  <rect x="643" y="340" width="250" height="44" rx="9" fill="#e2efff"/>
  <text class="lane-title" x="768" y="370" text-anchor="middle">③ 只读工具</text>
  <text class="lane-body" x="768" y="419" text-anchor="middle">订单 · 物流 · 商品</text>
  <text class="lane-body" x="768" y="450" text-anchor="middle">退款进度等实时事实</text>
  <text class="lane-body" x="768" y="481" text-anchor="middle">参数与身份校验</text>
  <text class="lane-note" x="768" y="526" text-anchor="middle">电商业务 API 只读访问</text>

  <rect x="924" y="327" width="272" height="231" rx="14" fill="#f4f3ff" stroke="#aaa3e9" stroke-width="2"/>
  <rect x="935" y="340" width="250" height="44" rx="9" fill="#e8e5ff"/>
  <text class="lane-title" x="1060" y="370" text-anchor="middle">④ 工具与知识联合</text>
  <text class="lane-body" x="1060" y="426" text-anchor="middle">实时商品事实</text>
  <text class="lane-body" x="1060" y="459" text-anchor="middle">＋ 稳定知识规则</text>
  <text class="lane-note" x="1060" y="519" text-anchor="middle">合并证据并说明限制条件</text>

  <rect x="1216" y="327" width="272" height="231" rx="14" fill="#fff8ee" stroke="#e3b06e" stroke-width="2"/>
  <rect x="1227" y="340" width="250" height="44" rx="9" fill="#ffecd0"/>
  <text class="lane-title" x="1352" y="370" text-anchor="middle">⑤ 售后工作流</text>
  <text class="lane-body" x="1352" y="418" text-anchor="middle">LangGraph 核验事实/资格</text>
  <text class="lane-body" x="1352" y="450" text-anchor="middle">暂停 → 人工审批 → 恢复</text>
  <text class="lane-body" x="1352" y="482" text-anchor="middle">仅生成模拟售后申请</text>
  <text x="1352" y="526" text-anchor="middle" fill="#ad3e29" font-size="16" font-weight="700">不执行真实退款或退货</text>

  <path class="flow-blue" d="M 184 559 V 598"/>
  <path class="flow-blue" d="M 476 559 V 598"/>
  <path class="flow-blue" d="M 768 559 V 598"/>
  <path class="flow-blue" d="M 1060 559 V 598"/>
  <path class="flow-blue" d="M 1352 559 V 598"/>
  <rect x="48" y="605" width="1440" height="52" rx="12" fill="#e9f2ff" stroke="#4b85cf" stroke-width="2"/>
  <text x="768" y="638" text-anchor="middle" fill="#153d77" font-size="23" font-weight="700">安全响应与结构化证据  ·  答案 / 引用 / 工具记录 / 工作流状态</text>

  <!-- 离线/按需知识准备：不随每次客服请求重新解析。 -->
  <rect x="24" y="700" width="1488" height="263" rx="19" fill="#ffffff" stroke="#78bfc1" stroke-width="2"/>
  <rect x="24" y="700" width="1488" height="43" rx="19" fill="#e6f6f4"/>
  <rect x="24" y="724" width="1488" height="19" fill="#e6f6f4"/>
  <text class="section-title" x="47" y="730">知识接入与索引构建</text>
  <text class="section-note" x="1486" y="730" text-anchor="end">首次加载 / 受控重建；非每轮请求</text>

  <rect x="48" y="760" width="272" height="148" rx="13" fill="#f0fbfa" stroke="#89c6c7" stroke-width="2"/>
  <text class="ingest-title" x="184" y="795" text-anchor="middle">本地多格式知识源</text>
  <text class="ingest-body" x="184" y="830" text-anchor="middle">Markdown / TXT</text>
  <text class="ingest-body" x="184" y="857" text-anchor="middle">文字版 PDF / 普通 DOCX</text>
  <text class="ingest-body" x="184" y="884" text-anchor="middle">稳定政策与规则</text>

  <rect x="340" y="760" width="272" height="148" rx="13" fill="#f0fbfa" stroke="#89c6c7" stroke-width="2"/>
  <text class="ingest-title" x="476" y="795" text-anchor="middle">LangChain Loader</text>
  <text class="ingest-body" x="476" y="830" text-anchor="middle">TextLoader / PyPDFLoader</text>
  <text class="ingest-body" x="476" y="857" text-anchor="middle">Docx2txtLoader</text>
  <text class="ingest-body" x="476" y="884" text-anchor="middle">统一提取可用文本</text>

  <rect x="632" y="760" width="272" height="148" rx="13" fill="#f0fbfa" stroke="#89c6c7" stroke-width="2"/>
  <text class="ingest-title" x="768" y="795" text-anchor="middle">元数据与结构校验</text>
  <text class="ingest-body" x="768" y="830" text-anchor="middle">MD：frontmatter / H2 / 注释</text>
  <text class="ingest-body" x="768" y="857" text-anchor="middle">其他：.meta.yaml / PDF 页码</text>
  <text class="ingest-body" x="768" y="884" text-anchor="middle">校验清单字段与重复 ID</text>

  <rect x="924" y="760" width="272" height="148" rx="13" fill="#f0fbfa" stroke="#89c6c7" stroke-width="2"/>
  <text class="ingest-title" x="1060" y="795" text-anchor="middle">章节 / 页内切块</text>
  <text class="ingest-body" x="1060" y="830" text-anchor="middle">420 字 · 80 字重叠</text>
  <text class="ingest-body" x="1060" y="857" text-anchor="middle">保留稳定 chunk ID</text>
  <text class="ingest-body" x="1060" y="884" text-anchor="middle">携带来源与引用信息</text>

  <rect x="1216" y="760" width="272" height="148" rx="13" fill="#f0fbfa" stroke="#89c6c7" stroke-width="2"/>
  <text class="ingest-title" x="1352" y="795" text-anchor="middle">进程内知识索引</text>
  <text class="ingest-body" x="1352" y="830" text-anchor="middle">SHA-256 切块指纹</text>
  <text class="ingest-body" x="1352" y="857" text-anchor="middle">倒排索引 · 按需向量化</text>
  <text class="ingest-body" x="1352" y="884" text-anchor="middle">失败不替换旧快照</text>

  <path class="flow-teal" d="M 321 834 H 332"/>
  <path class="flow-teal" d="M 613 834 H 624"/>
  <path class="flow-teal" d="M 905 834 H 916"/>
  <path class="flow-teal" d="M 1197 834 H 1208"/>
  <text x="768" y="944" text-anchor="middle" fill="#467278" font-size="17">上方知识检索与联合路径按需读取索引；向量结果缓存在进程内，修改文档后需重启或受控重建。</text>

  <rect x="24" y="983" width="1488" height="95" rx="16" fill="#eef3fa" stroke="#b4c8df" stroke-width="2"/>
  <text class="footer-title" x="47" y="1015">外部依赖与横向治理</text>
  <text class="footer-body" x="47" y="1047">模型服务：对话 / Embedding / 可选重排</text>
  <text class="footer-body" x="543" y="1047">电商业务 API：实时事实 / 只读查询</text>
  <text class="footer-body" x="1040" y="1047">安全降级 / 脱敏轨迹 / 成本 / 评测反馈</text>
</svg>
