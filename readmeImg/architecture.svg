  <path class="flow-blue" d="M 184 293 V 319"/>
  <path class="flow-blue" d="M 476 293 V 319"/>
  <path class="flow-blue" d="M 768 293 V 319"/>
  <path class="flow-blue" d="M 1060 293 V 319"/>
  <path class="flow-blue" d="M 1352 293 V 319"/>

  <rect x="48" y="327" width="272" height="231" rx="14" fill="#f3f8ff" stroke="#8bb6e7" stroke-width="2"/>
  <rect x="59" y="340" width="250" height="44" rx="9" fill="#e2efff"/>
  <text class="lane-title" x="184" y="370" text-anchor="middle">① 常规对话</text>
  <text class="lane-body" x="184" y="426" text-anchor="middle">问候与基础交互</text>
  <text class="lane-body" x="184" y="459" text-anchor="middle">多轮澄清与指代消歧</text>
  <text class="lane-note" x="184" y="519" text-anchor="middle">无需证据时避免额外调用</text>

  <rect x="340" y="327" width="272" height="231" rx="14" fill="#effaf9" stroke="#75c2c3" stroke-width="2"/>
  <rect x="351" y="340" width="250" height="44" rx="9" fill="#d9f1f0"/>
  <text class="lane-title" x="476" y="370" text-anchor="middle">② 知识检索</text>
  <text class="lane-body" x="476" y="413" text-anchor="middle">子块：双向量＋关键词</text>
  <text class="lane-body" x="476" y="442" text-anchor="middle">RRF → 重排 → 可靠性</text>
  <text class="lane-body" x="476" y="471" text-anchor="middle">父块回填 · 去重 · 引用</text>
  <text class="lane-note" x="476" y="507" text-anchor="middle">最多 2 父块 / 正文 3200 字符</text>
  <text class="lane-note" x="476" y="536" text-anchor="middle">同快照回填 · 不截断例外</text>

  <rect x="632" y="327" width="272" height="231" rx="14" fill="#f3f8ff" stroke="#8bb6e7" stroke-width="2"/>
  <rect x="643" y="340" width="250" height="44" rx="9" fill="#e2efff"/>
  <text class="lane-title" x="768" y="370" text-anchor="middle">③ 只读工具</text>
  <text class="lane-body" x="768" y="419" text-anchor="middle">订单 · 物流 · 商品</text>
  <text class="lane-body" x="768" y="450" text-anchor="middle">退款进度等实时事实</text>
  <text class="lane-body" x="768" y="481" text-anchor="middle">参数与身份校验</text>
  <text class="lane-note" x="768" y="526" text-anchor="middle">电商业务 API 只读访问</text>

  <rect x="924" y="327" width="272" height="231" rx="14" fill="#f4f3ff" stroke="#aaa3e9" stroke-width="2"/>
  <rect x="935" y="340" width="250" height="44" rx="9" fill="#e8e5ff"/>
  <text class="lane-title" x="1060" y="370" text-anchor="middle">④ 工具与知识联合</text>
  <text class="lane-body" x="1060" y="426" text-anchor="middle">实时商品事实</text>
  <text class="lane-body" x="1060" y="459" text-anchor="middle">＋ 商品 / 活动父块证据</text>
  <text class="lane-note" x="1060" y="519" text-anchor="middle">合并证据并说明限制条件</text>

  <rect x="1216" y="327" width="272" height="231" rx="14" fill="#fff8ee" stroke="#e3b06e" stroke-width="2"/>
  <rect x="1227" y="340" width="250" height="44" rx="9" fill="#ffecd0"/>
  <text class="lane-title" x="1352" y="370" text-anchor="middle">⑤ 售后工作流</text>
  <text class="lane-body" x="1352" y="412" text-anchor="middle">事实 / 资格 → interrupt</text>
  <text class="lane-body" x="1352" y="441" text-anchor="middle">人工审批 → Resume 校验</text>
  <text class="lane-body" x="1352" y="470" text-anchor="middle">恢复原图 → 复查 → 防重</text>
  <text class="lane-note" x="1352" y="503" text-anchor="middle">SQLite 图快照＋审批记录</text>
  <text x="1352" y="536" text-anchor="middle" fill="#ad3e29" font-size="16" font-weight="700">模拟申请 · 不执行真实退款</text>

  <path class="flow-blue" d="M 184 559 V 598"/>
  <path class="flow-blue" d="M 476 559 V 598"/>
  <path class="flow-blue" d="M 768 559 V 598"/>
  <path class="flow-blue" d="M 1060 559 V 598"/>
  <path class="flow-blue" d="M 1352 559 V 598"/>
  <rect x="48" y="605" width="1440" height="52" rx="12" fill="#e9f2ff" stroke="#4b85cf" stroke-width="2"/>
  <text x="768" y="638" text-anchor="middle" fill="#153d77" font-size="23" font-weight="700">安全响应与结构化证据  ·  答案 / 引用 / 工具记录 / 工作流状态</text>

  <!-- 离线/按需知识准备：不随每次客服请求重新解析。 -->
  <rect x="24" y="700" width="1488" height="263" rx="19" fill="#ffffff" stroke="#78bfc1" stroke-width="2"/>
  <rect x="24" y="700" width="1488" height="43" rx="19" fill="#e6f6f4"/>
  <rect x="24" y="724" width="1488" height="19" fill="#e6f6f4"/>
  <text class="section-title" x="47" y="730">知识接入与索引构建</text>
  <text class="section-note" x="1486" y="730" text-anchor="end">首次加载 / 受控重建；非每轮请求</text>

  <rect x="48" y="760" width="272" height="148" rx="13" fill="#f0fbfa" stroke="#89c6c7" stroke-width="2"/>
  <text class="ingest-title" x="184" y="795" text-anchor="middle">本地多格式知识源</text>
  <text class="ingest-body" x="184" y="830" text-anchor="middle">Markdown / TXT</text>
  <text class="ingest-body" x="184" y="857" text-anchor="middle">文字版 PDF / 普通 DOCX</text>
  <text class="ingest-body" x="184" y="884" text-anchor="middle">稳定政策与规则</text>

  <rect x="340" y="760" width="272" height="148" rx="13" fill="#f0fbfa" stroke="#89c6c7" stroke-width="2"/>
  <text class="ingest-title" x="476" y="795" text-anchor="middle">LangChain Loader</text>
  <text class="ingest-body" x="476" y="830" text-anchor="middle">TextLoader / PyPDFLoader</text>
  <text class="ingest-body" x="476" y="857" text-anchor="middle">Docx2txtLoader</text>
  <text class="ingest-body" x="476" y="884" text-anchor="middle">统一提取可用文本</text>

  <rect x="632" y="760" width="272" height="148" rx="13" fill="#f0fbfa" stroke="#89c6c7" stroke-width="2"/>
  <text class="ingest-title" x="768" y="795" text-anchor="middle">元数据与结构校验</text>
  <text class="ingest-body" x="768" y="830" text-anchor="middle">MD：frontmatter / H2 / 注释</text>
  <text class="ingest-body" x="768" y="857" text-anchor="middle">其他：.meta.yaml / PDF 页码</text>
  <text class="ingest-body" x="768" y="884" text-anchor="middle">来源偏移 · 政策生命周期</text>

  <rect x="924" y="760" width="272" height="148" rx="13" fill="#f0fbfa" stroke="#89c6c7" stroke-width="2"/>
  <text class="ingest-title" x="1060" y="795" text-anchor="middle">有界父子分块</text>
  <text class="ingest-body" x="1060" y="830" text-anchor="middle">父块 1600 / 重叠 160</text>
  <text class="ingest-body" x="1060" y="857" text-anchor="middle">子块 420 / 重叠 80</text>
  <text class="ingest-body" x="1060" y="884" text-anchor="middle">H2 / 段落 · PDF 跨页定位</text>

  <rect x="1216" y="760" width="272" height="148" rx="13" fill="#f0fbfa" stroke="#89c6c7" stroke-width="2"/>
  <text class="ingest-title" x="1352" y="795" text-anchor="middle">进程内知识索引</text>
  <text class="ingest-body" x="1352" y="830" text-anchor="middle">父子正文 / 映射 / 配置指纹</text>
  <text class="ingest-body" x="1352" y="857" text-anchor="middle">子块倒排 · 仅子块向量化</text>
  <text class="ingest-body" x="1352" y="884" text-anchor="middle">完整校验 · 原子换快照</text>

  <path class="flow-teal" d="M 321 834 H 332"/>
  <path class="flow-teal" d="M 613 834 H 624"/>
  <path class="flow-teal" d="M 905 834 H 916"/>
  <path class="flow-teal" d="M 1197 834 H 1208"/>
  <text x="768" y="944" text-anchor="middle" fill="#467278" font-size="17">三条 RAG 路径共用父块回填；父块不单独召回。缺映射则兜底，重建失败保留旧快照；仍为进程内索引。</text>

  <rect x="24" y="983" width="1488" height="95" rx="16" fill="#eef3fa" stroke="#b4c8df" stroke-width="2"/>
  <text class="footer-title" x="47" y="1015">外部依赖与横向治理</text>
  <text class="footer-body" x="47" y="1047">模型：对话 / 向量 / 可选重排 · 业务 API：只读</text>
  <text class="footer-body" x="543" y="1047">SQLite：售后恢复 · 单进程 · 非真实支付</text>
  <text class="footer-body" x="1040" y="1047">安全降级 / 脱敏轨迹 / 成本 / 评测反馈</text>
</svg>
